<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUNキャリ2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #333333;
    --heading: #1a1a1a;
    --accent: #d1403f;
    --accent-hover: #b53433;
    --video-bg: #2b2b2b;
    --video-text: #ffffff;
    --ink: #222222;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --text: #e4e4e4;
      --heading: #ffffff;
      --accent: #d9534f;
      --accent-hover: #e8706c;
      --ink: #e4e4e4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --text: #e4e4e4;
    --heading: #ffffff;
    --accent: #d9534f;
    --accent-hover: #e8706c;
    --ink: #e4e4e4;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    line-height: 1.8;
    font-size: 16px;
  }

  /* ===== Header ===== */
  .site-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
  }
  .site-header svg { width: 42px; height: 42px; flex: none; }
  .site-header .name {
    font-size: 22px;
    font-weight: 500;
    color: var(--heading);
    letter-spacing: 0.02em;
  }

  /* ===== Main ===== */
  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 8px 24px 80px;
  }
  .lead { margin: 0; max-width: 62em; }
  .date {
    margin: 6px 0 0;
    font-size: clamp(22px, 3.2vw, 30px);
    font-weight: 700;
    color: var(--heading);
    line-height: 1.5;
  }
  .date span { display: inline-block; margin-left: 0.8em; }

  /* ===== Grid ===== */
  .grid {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 56px;
    row-gap: 56px;
  }
  .cell {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr);
    column-gap: 24px;
    align-items: start;
  }
  .cell .icon {
    display: flex;
    justify-content: center;
    padding-top: 18px;
  }
  .cell .icon svg { width: 140px; height: auto; max-height: 140px; }
  .cell.blank { visibility: hidden; }

  .btn {
    display: block;
    width: 100%;
    padding: 6px 12px;
    background: var(--accent);
    color: #fff;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.6;
    border-radius: 2px;
    transition: background-color .15s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible { outline: 3px solid var(--heading); outline-offset: 3px; }

  .body { padding: 14px 8px 0; font-size: 16px; }
  .body p { margin: 0 0 1.2em; }
  .body p:last-child { margin-bottom: 0; }
  .body a { color: var(--ink); text-decoration: underline; }
  .body a:hover { color: var(--accent); }
  .note { font-size: 12px; line-height: 2.2; }

  /* ===== Video placeholder ===== */
  .video {
    margin-top: 12px;
    background: var(--video-bg);
    color: var(--video-text);
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }
  .video .msg {
    display: grid;
    grid-template-columns: 40px 1fr;
    column-gap: 16px;
    align-items: center;
    max-width: 320px;
  }
  .video .msg svg { width: 40px; height: 40px; }
  .video .msg strong { display: block; font-size: 14px; margin-bottom: 2px; }
  .video .msg small { font-size: 12px; line-height: 1.5; display: block; }
  .video .msg a { color: #fff; font-size: 12px; }

  /* ===== Responsive ===== */
  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; row-gap: 44px; }
    .cell.blank { display: none; }
  }
  @media (max-width: 520px) {
    main { padding: 4px 18px 64px; }
    .cell { grid-template-columns: 84px minmax(0, 1fr); column-gap: 14px; }
    .cell .icon { padding-top: 8px; }
    .cell .icon svg { width: 80px; }
    .date span { display: block; margin-left: 0; }
    .site-header .name { font-size: 19px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="logo.png" alt="FUNキャリ" style="width:30px;height:30px;flex:none;">
  <span class="name">YANキャリ2026</span>
</header>

<main>
  <p class="lead">
    本イベントでは1日で多様な業界から約1社が出展します。28卒の学部3年次・修士1年次はもちろん、今後のキャリアを考える低学年・苫小牧市役所OB・プロキックボクサーも歓迎します。<br>
    ぜひ1社でも多く話を聞き、将来の可能性を広げてください。
  </p>
  <h1 class="date">開催日<span>2026年11月25日(水)</span></h1>

  <div class="grid">

    <!-- 左上: 参加企業一覧 -->
    <section class="cell">
      <div class="icon">
        <svg viewBox="0 0 140 120" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <!-- 3 -->
          <g transform="rotate(-4 98 40)">
            <path d="M78 22 h40 v50 h-40 z" fill="#fff"/>
            <rect x="82" y="12" width="32" height="10" fill="#d1403f"/>
            <text x="98" y="58" text-anchor="middle" font-size="24" font-weight="700" font-style="italic" fill="#222" stroke="none" font-family="Noto Sans JP, sans-serif">3</text>
          </g>
          <!-- 2 -->
          <g transform="rotate(-18 66 78)">
            <path d="M46 56 h40 v40 h-40 z" fill="#fff"/>
            <text x="66" y="86" text-anchor="middle" font-size="24" font-weight="700" font-style="italic" fill="#222" stroke="none" font-family="Noto Sans JP, sans-serif">2</text>
          </g>
          <!-- 1 -->
          <g transform="rotate(-32 34 98)">
            <path d="M14 78 h40 v36 h-40 z" fill="#fff"/>
            <text x="34" y="104" text-anchor="middle" font-size="24" font-weight="700" font-style="italic" fill="#222" stroke="none" font-family="Noto Sans JP, sans-serif">1</text>
          </g>
        </svg>
      </div>
      <div>
        <a class="btn" href="#">参加企業一覧</a>
        <div class="body">
          <p>日毎の出展企業のブース番号を確認できます。</p>
        </div>
      </div>
    </section>

    <!-- 右上: 企業別詳細 -->
    <section class="cell">
      <div class="icon">
        <svg viewBox="0 0 140 130" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <!-- ブース(アイソメ風の箱) -->
          <path d="M30 20 L80 6 L124 36 V96 L74 120 L24 90 Z" fill="#fff"/>
          <path d="M30 20 L74 48 L124 36"/>
          <path d="M74 48 V120"/>
          <path d="M24 90 L74 120"/>
          <!-- 机 -->
          <path d="M34 62 L66 80 L96 66 L64 48 Z" fill="#f2c14e"/>
          <path d="M34 62 v12 L66 92 v-12"/>
          <path d="M66 92 L96 78 v-12"/>
          <!-- 人 -->
          <circle cx="58" cy="30" r="6" fill="#fff"/>
          <path d="M50 44 q8 -10 16 0 v8 h-16 z" fill="#fff"/>
          <circle cx="86" cy="52" r="5" fill="#fff"/>
          <circle cx="44" cy="72" r="5" fill="#fff"/>
          <circle cx="62" cy="84" r="5" fill="#fff"/>
        </svg>
      </div>
      <div>
        <a class="btn" href="#">企業別詳細</a>
        <div class="body">
          <p>本学イベントシステム【キャリタスCMS】より個別の企業情報を参照できます。</p>
          <p>検索画面では募集職種やOB有無など検索条件を設定できます。<a href="#">詳細はこちら。</a></p>
        </div>
      </div>
    </section>

    <!-- 左下: 余白(あとでイベント参加ガイドを入れる) -->
    <div class="cell blank" aria-hidden="true"></div>

    <!-- 右下: 告知動画 -->
    <section class="cell">
      <div class="icon">
        <svg viewBox="0 0 100 80" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <rect x="6" y="8" width="88" height="14" rx="3" fill="#fff"/>
          <path d="M18 8 l-6 14 M34 8 l-6 14 M50 8 l-6 14 M66 8 l-6 14 M82 8 l-6 14" stroke-width="2.5"/>
          <rect x="6" y="22" width="88" height="50" rx="4" fill="#fff"/>
          <path d="M42 36 L64 47 L42 58 Z" fill="#d1403f" stroke="#222"/>
        </svg>
      </div>
      <div>
        <a class="btn" href="https://youtu.be/rI3bdVwjQ18?si=FVZesByxgaY19O0R">告知動画</a>
        <!-- YouTubeの動画URLが決まったら、この .video を <iframe> に置き換えてください -->
        <div class="video" style="padding:0">
          <iframe src="https://www.youtube.com/embed/rI3bdVwjQ18?si=FVZesByxgaY19O0R" title="告知動画" allowfullscreen
            style="width:100%;height:100%;border:0;"></iframe>
        </div>
      </div>
    </section>

  </div>
</main>

</body>
</html>
